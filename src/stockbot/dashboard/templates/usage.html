{% extends "base.html" %}
{% block title %}Usage · JBSB{% endblock %}
{% block page %}usage{% endblock %}
{% block body %}
<h1 class="pagetitle">Token usage <span class="muted">what the AI models read and wrote · updates live</span></h1>
<div class="headline" id="usagekpis"></div>
<section class="card">
  <div class="cardhead"><h2>Tokens used <span class="muted" id="tokens-note"></span></h2>
    <span class="seg"><button data-span="today" class="on">Today</button><button data-span="7d">7 days</button></span></div>
  <div class="legend inline" id="tokenslegend"></div>
  <div class="chart"><canvas id="tokens"></canvas></div>
</section>
<section class="card"><h2>Per bot</h2><div class="tablewrap"><table id="usage" class="stats"></table></div></section>
{% endblock %}
