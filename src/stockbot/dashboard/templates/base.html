<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}StockBot Arena{% endblock %}</title>
<style>
:root {
  color-scheme: light;
  --surface-0: #f4f3f0; --surface-1: #fcfcfb; --border: #e3e2de;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #7a7974;
  --grid: #ecebe7;
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
  --series-5: #e87ba4; --series-6: #008300; --series-7: #6250d6; --series-8: #e34948;
  --bench: #7a7974;
  --div-neg: #e34948; --div-mid: #f0efec; --div-pos: #2a78d6;
  --good: #0ca30c; --warning: #fab219; --critical: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-0: #121211; --surface-1: #1a1a19; --border: #2e2e2c;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --grid: #262624;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
    --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-8: #e66767;
    --bench: #8f8e86;
    --div-neg: #e66767; --div-mid: #383835; --div-pos: #3987e5;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #121211; --surface-1: #1a1a19; --border: #2e2e2c;
  --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
  --grid: #262624;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
  --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-8: #e66767;
  --bench: #8f8e86;
  --div-neg: #e66767; --div-mid: #383835; --div-pos: #3987e5;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface-0); color: var(--text-primary);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 16px; padding: 12px 20px;
  background: var(--surface-1); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0; }
header nav a { color: var(--text-secondary); text-decoration: none; margin-right: 12px; }
header nav a:hover { color: var(--text-primary); }
main { padding: 16px 20px; max-width: 1400px; margin: 0 auto; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
  padding: 14px 16px; margin-bottom: 16px; }
.card h2 { font-size: 14px; margin: 0 0 10px; color: var(--text-secondary); font-weight: 600; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th { color: var(--text-secondary); font-weight: 600; font-size: 12px; cursor: help; }
th:first-child, td:first-child, td.l, th.l { text-align: left; }
td.wrap { white-space: normal; text-align: left; min-width: 240px; }
.pos { color: var(--good); } .neg { color: var(--critical); }
.muted { color: var(--text-muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px;
  border: 1px solid var(--border); font-size: 12px; color: var(--text-secondary); }
.chip b { color: var(--text-primary); font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.swatch { width: 14px; height: 3px; display: inline-block; vertical-align: middle; margin-right: 6px; border-radius: 2px; }
button { font: inherit; background: var(--surface-0); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
button:hover { border-color: var(--text-muted); }
button.on { background: var(--text-primary); color: var(--surface-1); }
.strip { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chart { position: relative; height: 280px; }
.heat td { text-align: center; min-width: 64px; }
.heat td.l, .heat th.l { text-align: left; }
details summary { cursor: pointer; }
pre { white-space: pre-wrap; word-break: break-word; max-height: 420px; overflow: auto;
  background: var(--surface-0); padding: 10px; border-radius: 6px; font-size: 12px; }
a { color: var(--series-1); }
@media (max-width: 600px) { main { padding: 12px 16px; } .grid2 { grid-template-columns: 1fr; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
{% block head %}{% endblock %}
</head>
<body data-page="{% block page %}{% endblock %}">
<header>
  <h1>StockBot Arena</h1>
  <nav><a href="/">Leaderboard</a>{% for s in series %}{% if not s.startswith('benchmark') %}<a href="/arm/{{ s }}">{{ s }}</a>{% endif %}{% endfor %}</nav>
  <div class="strip" id="status"></div>
</header>
<main>{% block body %}{% endblock %}</main>
<script>window.SERIES = {{ series | tojson }}; window.TIPS = {{ tips | tojson }};</script>
<script src="/static/app.js"></script>
</body>
</html>
