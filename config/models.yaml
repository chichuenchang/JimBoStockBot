# Model ids + prices from tracker sites, unverified (2026-10-21). Check provider pricing pages.
# Prices: USD per 1M tokens. monthly_cap_usd counts toward settings.global_cap_usd when enabled.
models:
  kimi-k3:
    adapter: openai_compat
    base_url: https://api.moonshot.ai/v1
    model: kimi-k3
    api_key_env: MOONSHOT_API_KEY
    price_in: 3.0
    price_in_cached: 0.30
    price_out: 15.0
    monthly_cap_usd: 80
    enabled: false
    extra_body: {reasoning_effort: low}  # K3 always thinks; low effort is the floor
  deepseek-v4.1-flash:
    # peak prices (conservative); off-peak is half
    adapter: openai_compat
    base_url: https://api.deepseek.com
    model: deepseek-flash
    api_key_env: DEEPSEEK_API_KEY
    price_in: 0.30
    price_in_cached: 0.03
    price_out: 1.20
    monthly_cap_usd: 35
    enabled: true
    extra_body: {thinking: {type: disabled}}  # V4 thinks by default (effort high)

  # placeholders
  claude:
    adapter: anthropic
    base_url: https://api.anthropic.com
    model: claude-opus-5-5
    api_key_env: ANTHROPIC_API_KEY
    price_in: 4.0
    price_in_cached: 0.20
    price_out: 20.0
    monthly_cap_usd: 0
    enabled: false
  gpt:
    adapter: openai_compat
    base_url: https://openrouter.ai/api/v1
    model: openai/gpt-5.1
    api_key_env: OPENROUTER_API_KEY
    price_in: 0
    price_in_cached: 0
    price_out: 0
    monthly_cap_usd: 0
    enabled: false
  grok:
    adapter: openai_compat
    base_url: https://openrouter.ai/api/v1
    model: x-ai/grok-4
    api_key_env: OPENROUTER_API_KEY
    price_in: 0
    price_in_cached: 0
    price_out: 0
    monthly_cap_usd: 0
    enabled: false
  qwen:
    adapter: openai_compat
    base_url: https://openrouter.ai/api/v1
    model: qwen/qwen3-max
    api_key_env: OPENROUTER_API_KEY
    price_in: 0
    price_in_cached: 0
    price_out: 0
    monthly_cap_usd: 0
    enabled: false
  gemini:
    adapter: openai_compat
    base_url: https://openrouter.ai/api/v1
    model: google/gemini-3-pro
    api_key_env: OPENROUTER_API_KEY
    price_in: 0
    price_in_cached: 0
    price_out: 0
    monthly_cap_usd: 0
    enabled: false
